name: build

on:
  push:
    branches: [main]
    # 推 v* 标签时额外发布 Release
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          # Intel 芯片 Mac 用原生 x86_64 运行器，单元测试也在 Intel 上跑
          - os: macos-15-intel
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --locked

      - name: 打包
        run: npx tauri build --ci

      # 每个安装包的 SHA256 / MD5 打到日志里，同时写进本次运行的摘要页，方便核对下载的文件
      - name: 产物校验值
        shell: bash
        run: |
          hash_sha256() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          hash_md5() { if command -v md5sum >/dev/null; then md5sum "$1" | cut -d' ' -f1; else md5 -q "$1"; fi; }
          cd src-tauri/target/release/bundle
          {
            echo "### ${{ matrix.os }} 产物校验值"
            echo
            echo "| 文件 | 大小（字节） | SHA256 | MD5 |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          found=0
          for f in nsis/*.exe msi/*.msi dmg/*.dmg deb/*.deb rpm/*.rpm appimage/*.AppImage; do
            [ -f "$f" ] || continue
            found=1
            size=$(wc -c < "$f" | tr -d ' ')
            s=$(hash_sha256 "$f")
            m=$(hash_md5 "$f")
            echo "$f"
            echo "  大小    $size"
            echo "  SHA256  $s"
            echo "  MD5     $m"
            echo "| \`$(basename "$f")\` | $size | \`$s\` | \`$m\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          [ "$found" = 1 ] || { echo "没有找到安装包"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: godbbs-launcher-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

      # 安装包文件名里的中文产品名换成英文，GitHub Release 的附件名不支持中文
      - name: 整理发布文件
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          cd src-tauri/target/release/bundle
          for f in nsis/*.exe msi/*.msi dmg/*.dmg deb/*.deb rpm/*.rpm appimage/*.AppImage; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            name=${name//神权论坛启动器/GodBBSLauncher}
            cp "$f" "$GITHUB_WORKSPACE/release/$name"
          done
          ls -la "$GITHUB_WORKSPACE/release"
          [ -n "$(ls -A "$GITHUB_WORKSPACE/release")" ]

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # 发布前再算一遍最终附件（文件名已换成英文）的校验值
      - name: 发布文件校验值
        working-directory: release
        run: |
          echo "SHA256:"; sha256sum *
          echo; echo "MD5:"; md5sum *
          {
            echo "### Release 附件校验值"
            echo
            echo "| 文件 | SHA256 | MD5 |"
            echo "|---|---|---|"
            for f in *; do echo "| \`$f\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` | \`$(md5sum "$f" | cut -d' ' -f1)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v3
        with:
          name: 神权论坛启动器 ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release/*
          body: |
            非官方粉丝纪念作品，与 MCBBS / Mojang Studios / Microsoft 无关；不包含任何 Minecraft 游戏文件。

            | 系统 | 下载 |
            |---|---|
            | Windows | `*_x64-setup.exe`（推荐）或 `*.msi` |
            | macOS（Apple 芯片） | `*_aarch64.dmg` |
            | macOS（Intel 芯片） | `*_x64.dmg` |
            | Linux | `*.AppImage` / `*.deb` / `*.rpm` |

            安装包暂未签名：Windows 可能弹出 SmartScreen，点「更多信息 → 仍要运行」；macOS 提示"已损坏"时在终端执行 `xattr -cr /Applications/神权论坛启动器.app`。
