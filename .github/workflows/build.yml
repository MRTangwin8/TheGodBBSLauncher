name: build

on:
  push:
    branches: [main]
    # 推 v* 标签时额外发布 Release
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          # Intel 芯片 Mac 用原生 x86_64 运行器，单元测试也在 Intel 上跑
          - os: macos-15-intel
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: 单元测试
        working-directory: src-tauri
        run: cargo test --locked

      # 配了更新签名密钥（仓库 Secrets）就同时生成应用内更新包和 .sig 签名；
      # 没配（比如 fork 来的 PR 读不到 Secrets）就只打普通安装包
      - name: 打包
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --ci --config src-tauri/tauri.updater.conf.json
          else
            echo "没有配置更新签名密钥：只打普通安装包，不生成应用内更新包"
            npx tauri build --ci
          fi

      # 配了签名密钥却没生成 .sig，说明更新包的命名或配置不对：直接让构建失败，别悄悄发出不能更新的版本
      - name: 核对更新签名文件
        if: env.TAURI_SIGNING_PRIVATE_KEY != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          cd src-tauri/target/release/bundle
          find . -name '*.sig' | sort
          [ -n "$(find . -name '*.sig')" ] || { echo "没有找到 .sig 签名文件"; exit 1; }

      # 每个安装包的 SHA256 / MD5 打到日志里，同时写进本次运行的摘要页，方便核对下载的文件
      - name: 产物校验值
        shell: bash
        run: |
          sha256_line() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi; }
          md5_line() { if command -v md5sum >/dev/null; then md5sum "$1"; else md5 -r "$1"; fi; }
          cd src-tauri/target/release/bundle
          files=()
          for f in nsis/*.exe msi/*.msi dmg/*.dmg deb/*.deb rpm/*.rpm appimage/*.AppImage; do
            [ -f "$f" ] && files+=("$f")
          done
          [ "${#files[@]}" -gt 0 ] || { echo "没有找到安装包"; exit 1; }
          # 直接用 sha256sum / md5sum 的标准格式打到 stdout：可以整行复制，也能用 sha256sum -c 核对
          echo "SHA256:"
          for f in "${files[@]}"; do sha256_line "$f"; done
          echo
          echo "MD5:"
          for f in "${files[@]}"; do md5_line "$f"; done
          # 同样的数据再写进本次运行的摘要页，方便阅读
          {
            echo "### ${{ matrix.os }} 产物校验值"
            echo
            echo "| 文件 | 大小（字节） | SHA256 | MD5 |"
            echo "|---|---|---|---|"
            for f in "${files[@]}"; do
              echo "| \`$(basename "$f")\` | $(wc -c < "$f" | tr -d ' ') | \`$(sha256_line "$f" | cut -d' ' -f1)\` | \`$(md5_line "$f" | cut -d' ' -f1)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: godbbs-launcher-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          if-no-files-found: error
          retention-days: 14

      # 安装包文件名里的中文产品名换成英文，GitHub Release 的附件名不支持中文
      - name: 整理发布文件
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/release"
          cd src-tauri/target/release/bundle
          # 安装包，加上 Windows / Linux 的应用内更新签名（安装包本身就是更新包）
          for f in nsis/*.exe msi/*.msi dmg/*.dmg deb/*.deb rpm/*.rpm appimage/*.AppImage nsis/*.exe.sig appimage/*.AppImage.sig; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            name=${name//神权论坛启动器/GodBBSLauncher}
            cp "$f" "$GITHUB_WORKSPACE/release/$name"
          done
          # macOS 的更新包 .app.tar.gz 文件名里没有版本和架构，按本机架构补上，不然两个 Mac 包会重名
          if [ -d macos ]; then
            ver=$(node -p "require('../../../tauri.conf.json').version") # 相对当前目录，Windows 路径里的反斜杠会让绝对路径出错
            case "$(uname -m)" in arm64|aarch64) arch=aarch64 ;; *) arch=x64 ;; esac
            for f in macos/*.app.tar.gz macos/*.app.tar.gz.sig; do
              [ -f "$f" ] || continue
              ext=${f#macos/*.app}
              cp "$f" "$GITHUB_WORKSPACE/release/GodBBSLauncher_${ver}_${arch}.app${ext}"
            done
          fi
          ls -la "$GITHUB_WORKSPACE/release"
          [ -n "$(ls -A "$GITHUB_WORKSPACE/release")" ]

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: release/
          if-no-files-found: error
          retention-days: 3

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 先 checkout 再下载：checkout 会清掉工作区里没跟踪的文件，顺序反了 release/ 就没了
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # 应用内更新的清单：各平台更新包的网址和签名。没有签名文件（没配密钥）就不生成
      - name: 生成应用内更新清单
        run: node scripts/make-latest-json.mjs release "${{ github.ref_name }}" "${{ github.repository }}"

      # 发布前再算一遍最终附件（文件名已换成英文）的校验值
      - name: 发布文件校验值
        working-directory: release
        run: |
          echo "SHA256:"; sha256sum *
          echo; echo "MD5:"; md5sum *
          {
            echo "### Release 附件校验值"
            echo
            echo "| 文件 | SHA256 | MD5 |"
            echo "|---|---|---|"
            for f in *; do echo "| \`$f\` | \`$(sha256sum "$f" | cut -d' ' -f1)\` | \`$(md5sum "$f" | cut -d' ' -f1)\` |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: softprops/action-gh-release@v3
        with:
          name: 神权论坛启动器 ${{ github.ref_name }}
          prerelease: true
          generate_release_notes: true
          files: release/*
          body: |
            非官方粉丝纪念作品，与 MCBBS / Mojang Studios / Microsoft 无关；不包含任何 Minecraft 游戏文件。

            | 系统 | 下载 |
            |---|---|
            | Windows | `*_x64-setup.exe`（推荐）或 `*.msi` |
            | macOS（Apple 芯片） | `*_aarch64.dmg` |
            | macOS（Intel 芯片） | `*_x64.dmg` |
            | Linux | `*.AppImage` / `*.deb` / `*.rpm` |

            安装包暂未签名：Windows 可能弹出 SmartScreen，点「更多信息 → 仍要运行」；macOS 提示"已损坏"时在终端执行 `xattr -cr /Applications/神权论坛启动器.app`。
