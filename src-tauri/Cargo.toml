[package]
name = "godbbs-launcher"
version = "0.1.0"
description = "神权论坛启动器（MCBBS 纪念版）— 跨平台 Minecraft Java 版启动器"
authors = ["MRTangwin8"]
edition = "2021"
license = "MIT"

[lib]
# 加 _lib 后缀避免和 bin 同名（Windows 上会冲突）
name = "godbbs_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
