[package]
name = "godbbs-launcher"
version = "0.3.8"
description = "神权论坛启动器（MCBBS 纪念版）— 跨平台 Minecraft Java 版启动器"
authors = ["MRTangwin8"]
edition = "2021"
license = "MIT"

[lib]
# 加 _lib 后缀避免和 bin 同名（Windows 上会冲突）
name = "godbbs_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "gzip", "brotli"] }
futures = "0.3"
sha1 = "0.10"
hex = "0.4"
thiserror = "2"
dirs = "6"
regex = "1"
toml = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 第三方 JDK（Azul Zulu）的 Linux 包是 tar.gz
flate2 = "1"
tar = "0.4"
# 服务器列表查 SRV 记录（_minecraft._tcp），和游戏一样用系统的 DNS 设置
hickory-resolver = { version = "0.24", default-features = false, features = ["tokio-runtime", "system-config"] }
uuid = { version = "1", features = ["v4"] }
md-5 = "0.10"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[features]
# 微软商店版：只能用正版账号，不在应用内更新（见 src/edition.rs）
store = []

# 应用内更新只有桌面端有
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
